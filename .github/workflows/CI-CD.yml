name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirement.txt

      - name: Compile Python sources
        run: python -m compileall --quiet main.py agent

      - name: Verify FastAPI application imports
        run: python -c "from main import app; assert app.title == 'MLOps Verification Agent'"

      - name: Audit dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit --requirement requirement.txt

      - name: Build container
        run: docker build --file dockerfile --tag mlops-verification-agent:ci .

      - name: Check container health endpoint
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 8000:8000 mlops-verification-agent:ci)"
          trap 'docker logs "$container_id"; docker stop "$container_id" >/dev/null' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done

          echo "The container did not become healthy in time."
          exit 1

  publish:
    name: Publish image
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: true
